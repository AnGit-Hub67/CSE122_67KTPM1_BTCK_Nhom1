<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Tiếp nhận lời mời — CampusMind</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/sv2-official.css">
    <script defer src="assets/js/sv2-config.js"></script>
    <script defer src="assets/js/sv2-api.js"></script>
    <script defer src="assets/js/admin-invitation.js"></script>
    <script src="assets/js/sv2-shell.js"></script>
</head>

<body>
    <main class="auth-layout">
        <h1>Tiếp nhận lời mời quản trị</h1>
        <p>Chỉ dành cho người nhận lời mời có thời hạn. Máy chủ kiểm tra mã mời và yêu cầu thiết lập xác thực hai lớp
            trước khi cấp quyền.</p>
        <p id="invite-status" role="status">Chưa kết nối API thì không thể tiếp nhận lời mời hoặc tạo tài khoản.</p>
        <form id="invite-form" class="auth-form"><label for="invite-token">Mã lời mời *</label><input id="invite-token"
                required autocomplete="off"><label for="invite-name">Họ tên *</label><input id="invite-name" required
                minlength="2" maxlength="150"><label for="invite-password">Mật khẩu *</label><input id="invite-password"
                type="password" required minlength="8" maxlength="128" autocomplete="new-password"><label
                for="invite-otp">Mã OTP từ bước thiết lập 2FA *</label><input id="invite-otp" required
                inputmode="numeric" autocomplete="one-time-code"><button id="invite-submit" class="primary">Tiếp nhận
                lời mời</button></form><a href="sv2-login.html?role=admin">Quay lại đăng nhập</a>
    </main>
</body>

</html>
